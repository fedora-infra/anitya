{% extends "master.html" %}

{% block body %}

<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="page-header mt-3 mb-4 pb-2 border-bottom">
      <h1>Project: {{ project.name }} - Delete version</h1>
    </div>

    <div class="list-group shadow-sm mb-3">
      <form method="POST" action="{{
          url_for('anitya_ui.delete_project_version',
                  project_id=project.id,
                  version=version) }}" >
        {{ form.csrf_token }}
        <div class="list-group-item">
          <h4 class="list-group-item-heading">
            Project
          </h4>
          <div class="list-group-item-text">
            {{ project.name }}
          </div>
        </div>
        <div class="list-group-item">
          <h4 class="list-group-item-heading">
            Version
          </h4>
          <div class="list-group-item-text">
            {{ version }}
          </div>
        </div>

      </div>
      <div class="d-flex justify-content-end gap-2">
        <button type="submit" name="confirm" value="Yes" class="btn btn-warning">
          Delete version
        </button>

        <a href="{{ url_for('anitya_ui.project', project_id=project.id) }}" class="btn btn-danger">
          Cancel
        </a>
      </div>
      </form>
  </div>
</div>

{% endblock %}
