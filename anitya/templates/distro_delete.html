{% extends "master.html" %}
{% from "functions.html" import render_field_in_row %}

{% block title %}Delete Distribution · Anitya{% endblock %}

{% block body %}

<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="page-header mt-3 mb-4 pb-2 border-bottom">
      <h1>Delete distribution: {{ distro.name }}</h1>
    </div>

    <form method="POST" action="{{ url_for('anitya_ui.delete_distro', distro_name=distro.name) }}">
      <div class="d-flex justify-content-end gap-2">
        <button type="submit" class="btn btn-warning">
          Delete distribution
        </button>
        <a href="{{ url_for('anitya_ui.distros') }}" class="btn btn-danger">
          Cancel
        </a>
      </div>
      {{ form.csrf_token }}
    </form>
  </div>
</div>

{% endblock %}
